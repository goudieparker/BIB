<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email confirmed — BIB</title>
<style>
  :root { --ink:#0B1A24; --ink-2:#5A7181; --paper:#EDF0EA; --card:#FFFFFF; --line:#DDE3DC; --pine:#0E6B60; --pine-soft:#E6F0EE; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#EDF1EE; --ink-2:#9FB2BE; --paper:#0B1613; --card:#121F26; --line:rgba(255,255,255,0.10); --pine:#2FA894; --pine-soft:rgba(47,168,148,0.14); }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:var(--paper); color:var(--ink);
         font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:32px 26px; text-align:center; }
  .mark { width:54px; height:54px; border-radius:50%; background:var(--pine-soft); color:var(--pine); display:flex; align-items:center; justify-content:center; margin:0 auto 18px; font-size:28px; font-weight:700; }
  h1 { margin:0 0 10px; font-size:26px; letter-spacing:-0.3px; }
  p { margin:0 0 14px; color:var(--ink-2); line-height:1.5; font-size:16px; }
  .btn { display:inline-block; margin-top:6px; padding:13px 26px; border-radius:999px; background:var(--pine); color:#fff; text-decoration:none; font-weight:700; letter-spacing:0.4px; font-size:14px; }
  small { display:block; margin-top:22px; color:var(--ink-2); font-size:13px; }
  a.link { color:var(--pine); }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">&#10003;</div>
  <h1>Email confirmed</h1>
  <p>Your BIB account is ready. Go back to the BIB app and sign in with your email and password.</p>
  <a class="btn" href="https://apps.apple.com/app/id6797370412">GET THE APP</a>
  <small>Questions? <a class="link" href="https://bibregistry.com/support">bibregistry.com/support</a></small>
</main>
</body>
</html>
